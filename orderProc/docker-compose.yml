services:
   order-service:
      build:
         context: .
      container_name: order-service
      ports:
         - "5384:5384"
      environment:
         SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
         SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      depends_on:
         - postgres
         - kafka

   notification-service:
      build:
         context: ../notification-service
      container_name: notification-service
      ports:
         - "5385:5385"
      environment:
         SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
         SPRING_MAIL_USERNAME: alexander19206r@gmail.com
         SPRING_MAIL_PASSWORD: lkxb tnez ghvg iaet

      extra_hosts:
         - "smtp.gmail.com:142.251.179.108"
      depends_on:
         - kafka
   postgres:
      image: postgres:16
      container_name: order-postgres
      environment:
         POSTGRES_DB: orderdb
         POSTGRES_USER: orderuser
         POSTGRES_PASSWORD: orderpass
      ports:
         - "5455:5432"
      volumes:
         - order_pgdata:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
         interval: 5s
         timeout: 5s
         retries: 5

   kafka:
      image: apache/kafka:3.8.0
      container_name: order-kafka
      ports:
         - "9092:9092"
      environment:
         KAFKA_NODE_ID: 1
         KAFKA_PROCESS_ROLES: broker,controller
         KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
         KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
         KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
         KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
         KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

   kafka-ui:
      image: kafbat/kafka-ui:latest
      container_name: order-kafka-ui
      ports:
         - "8090:8080"
      environment:
         KAFKA_CLUSTERS_0_NAME: order-platform
         KAFKA_CLUSTERs_0_BOOTSTRAPSERVERS: kafka:29092

      depends_on:
         - kafka

   redis:
      image: redis:7-alpine
      container_name: order-redis
      ports:
         - "6379:6379"

volumes:
   order_pgdata:
